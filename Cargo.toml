[package]
name = "ai_agent"
version = "0.1.0"
edition = "2024"

[[example]]
name = "complete_chat"
path = "example/complete_chat.rs"

[[example]]
name = "structured_chat"
path = "example/structured_chat.rs"

[[example]]
name = "stream_chat"
path = "example/stream_chat.rs"

[dependencies]
anyhow = "1.0.105"
async-openai = { version = "0.43.0", features = ["chat-completion"] }
async-stream = "0.3.6"
backon = "1.6.0"
dotenvy = "0.15.7"
futures = "0.3.34"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
